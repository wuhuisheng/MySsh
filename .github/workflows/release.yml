name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        run: npm run tauri build

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: mkdir -p dist-release && cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/
        shell: bash

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/deb/*.deb dist-release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm dist-release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-release/ 2>/dev/null || true
        shell: bash

      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p dist-release
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-release/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-release/ -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          draft: false
          prerelease: false
